<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Gestor de Películas</title>
    <link rel="stylesheet" href="dist/css/style.css">
</head>
<body>
    <header style="background: #1a1a1a; color: white; text-align: center; padding: 2rem;">
        <h1>Mis Películas Favoritas</h1>
        <p>8 películas imprescindibles</p>
    </header>
    
    <main style="max-width: 1200px; margin: 0 auto; padding: 1rem;">
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
            <input type="text" id="buscador" 
                   style="flex: 1; padding: 0.8rem; border: 2px solid #ddd; border-radius: 5px;"
                   placeholder="Buscar película...">
            <span id="contador" 
                  style="background: #e50914; color: white; padding: 0.8rem 1.5rem; border-radius: 5px;">
                8 películas
            </span>
        </div>
        
        <div id="contenedor" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;"></div>
        
        <div id="noResultados" style="display: none; text-align: center; padding: 3rem; color: #666;">
            No hay películas con ese título
        </div>
    </main>
    
    <footer style="background: #1a1a1a; color: white; text-align: center; padding: 1.5rem; margin-top: 2rem;">
        <p>Ejercicio 35 - Proyecto Integrador</p>
    </footer>
    
    <script src="dist/js/main.js"></script>
</body>
</html>
