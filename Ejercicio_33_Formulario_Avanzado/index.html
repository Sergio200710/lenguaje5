<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="dist/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Crear Cuenta</h1>
        <p>Completa todos los campos correctamente</p>
        
        <form id="formRegistro" class="form">
            <div class="form__grupo">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="ej: juan123">
                <span class="form__error" id="errorUsuario">Mínimo 3 caracteres (letras y números)</span>
            </div>
            
            <div class="form__grupo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
                <span class="form__error" id="errorEmail">Formato de correo inválido</span>
            </div>
            
            <div class="form__grupo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="********">
                <span class="form__error" id="errorPassword">Mínimo 8 caracteres, 1 mayúscula y 1 número</span>
            </div>
            
            <div class="form__grupo">
                <label for="confirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="confirmPassword" placeholder="********">
                <span class="form__error" id="errorConfirm">Las contraseñas no coinciden</span>
            </div>
            
            <div class="form__grupo">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" placeholder="123456789">
                <span class="form__error" id="errorTelefono">Debe tener 9 dígitos</span>
            </div>
            
            <button type="submit" class="form__btn" id="btnSubmit" disabled>Registrarse</button>
        </form>
        
        <div class="form__estado" id="estadoFormulario">
            Complete todos los campos correctamente
        </div>
    </div>
    
    <script src="dist/js/main.js"></script>
</body>
</html>
